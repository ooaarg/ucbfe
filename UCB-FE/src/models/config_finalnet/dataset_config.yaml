### Tiny data for tests only
Industrial:  # dataset_id
    data_root: ../../../data/
    data_format: parquet
    train_data: ../../../data/train_Industrial.parquet
    valid_data: ../../../data/test_Industrial.parquet
    test_data: ../../../data/test_Industrial.parquet
    # tmp_data: ../../../data/tmp_int.parquet
    min_categr_count: 1
    feature_cols:
        # Categorical features
        - {name: "mcat", active: True, dtype: str, type: categorical}
        - {name: "mcat_1", active: True, dtype: str, type: categorical}
        - {name: "mcat_2", active: True, dtype: str, type: categorical}
        - {name: "mcat_3", active: True, dtype: str, type: categorical}
        - {name: "mcat_4", active: True, dtype: str, type: categorical}
        - {name: "mcat_5", active: True, dtype: str, type: categorical}
        - {name: "cat_id", active: True, dtype: str, type: categorical}
        - {name: "item_region_id", active: True, dtype: str, type: categorical}
        - {name: "item_location_id", active: True, dtype: str, type: categorical}
        
        # Boolean feature
        - {name: "same_loc", active: True, dtype: int, type: categorical}

        # Inactive metadata features (saved but not used in model)
        - {name: "request_id", active: True, dtype: str, type: meta}
        - {name: "item_id", active: True, dtype: str, type: meta}
        - {name: "item_imps", active: True, dtype: int, type: meta}
        - {name: "item_shows", active: True, dtype: int, type: meta}

        
        # Numerical features with default settings
        - {name: ["bm_1", "bm_2", "bm_3", "bm_4"], active: True, dtype: float, type: numeric}
        - {name: ["tf_idf_1", "tf_idf_2", "tf_idf_3", "tf_idf_4"], active: True, dtype: float, type: numeric}
        - {name: ["idf_1", "idf_2", "idf_3", "idf_4", "idf_5", "idf_6", "idf_7", "idf_8", "idf_9", "idf_10", "idf_11"], active: True, dtype: float, type: numeric}
        - {name: ["trf_1", "trf_2", "trf_3", "trf_4", "trf_5", "trf_6"], active: True, dtype: float, type: numeric}
        - {name: ["query_info_1", "query_info_2", "query_info_3", "query_info_4"], active: True, dtype: float, type: numeric}
        - {name: ["item_info_1", "item_info_2", "item_info_3", "item_info_4", "item_info_5"], active: True, dtype: float, type: numeric}
        - {name: "dist", active: True, dtype: float, type: numeric}
        - {name: "item_delivery", active: True, dtype: float, type: numeric}
        - {name: ["word_count_1", "word_count_2", "word_count_3", "word_count_4", "word_count_5"], active: True, dtype: float, type: numeric}
        - {name: ["hit_count_1", "hit_count_2", "hit_count_3"], active: True, dtype: float, type: numeric}
        - {name: ["hit_pos_1", "hit_pos_2", "hit_pos_3", "hit_pos_4"], active: True, dtype: float, type: numeric}
        - {name: ["len_1", "len_2", "len_3"], active: True, dtype: float, type: numeric}
        - {name: ["lcs_1", "lcs_2", "lcs_3", "lcs_4", "lcs_5"], active: True, dtype: float, type: numeric}
        - {name: ["wlccs_1", "wlccs_2", "wlccs_3", "wlccs_4"], active: True, dtype: float, type: numeric}
        - {name: ["lccs_1", "lccs_2", "lccs_3", "lccs_4"], active: True, dtype: float, type: numeric}
        - {name: ["atc_1", "atc_2", "atc_3"], active: True, dtype: float, type: numeric}
        - {name: ["phrase_decay_1", "phrase_decay_2", "phrase_decay_3", "phrase_decay_4", "phrase_decay_5", "phrase_decay_6"], active: True, dtype: float, type: numeric}
        - {name: ["group_ctr_1", "group_ctr_2", "group_ctr_3"], active: True, dtype: float, type: numeric}
        - {name: "ctc", active: True, dtype: float, type: numeric}
        - {name: "ctr", active: True, dtype: float, type: numeric}
    
    label_col: {name: target,active: True, dtype: float}

